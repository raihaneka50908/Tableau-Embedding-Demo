<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pak Budi Resto Dashboard</title>
  <script type="module" src="https://prod-apsoutheast-c.online.tableau.com/javascripts/api/tableau.embedding.3.latest.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f7f7f7;
    }

    header {
      background: #1e3a5f;
      color: white;
      padding: 20px;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    .container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-gap: 20px;
      padding: 20px;
    }

    .viz-box {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      padding: 10px;
    }

    h3 {
      margin: 0 0 10px;
      font-size: 18px;
      color: #333;
    }

    tableau-viz {
      width: 100%;
      height: 400px;
      border: none;
      border-radius: 8px;
    }

    /* Full width row */
    .full-width {
      grid-column: span 2;
    }
  </style>
</head>
<body>
  <header>
    <h1>📊 Pak Budi Resto Dashboard</h1>
  </header>

  <div class="container">
    <!-- Revenue Trend -->
    <div class="viz-box">
      <h3>Revenue Trend</h3>
      <tableau-viz
        id="revenue-trend"
        src="https://prod-apsoutheast-c.online.tableau.com/t/suplosite/views/ExampleWorkbook/RevenueTrendDashboard"
        token="PASTE_YOUR_EMBED_TOKEN_HERE"
      ></tableau-viz>
    </div>

    <!-- Menu Contribution -->
    <div class="viz-box">
      <h3>Menu Contribution to Omset</h3>
      <tableau-viz
        id="menu-contribution"
        src="https://prod-apsoutheast-c.online.tableau.com/t/suplosite/views/ExampleWorkbook/MenuContributiontoOmsetDashboard"
        token="PASTE_YOUR_EMBED_TOKEN_HERE"
      ></tableau-viz>
    </div>

    <!-- Revenue Per Branch -->
    <div class="viz-box">
      <h3>Revenue per Branch</h3>
      <tableau-viz
        id="revenue-branch"
        src="https://prod-apsoutheast-c.online.tableau.com/t/suplosite/views/ExampleWorkbook/RevenuePerBranchDashboard"
        token="PASTE_YOUR_EMBED_TOKEN_HERE"
      ></tableau-viz>
    </div>

    <!-- Net Profit Per Branch -->
    <div class="viz-box">
      <h3>Net Profit per Branch</h3>
      <tableau-viz
        id="net-profit-branch"
        src="https://prod-apsoutheast-c.online.tableau.com/t/suplosite/views/ExampleWorkbook/NetProfitPerBranchDashboard"
        token="PASTE_YOUR_EMBED_TOKEN_HERE"
      ></tableau-viz>
    </div>
  </div>
</body>
</html>
