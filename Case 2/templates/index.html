<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Restaurant Analytics</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script type="module" src="{{ url_for('static', filename='app.js') }}"></script>
  <!-- Tableau Embedding API -->
  <script type="module" src="https://prod-apsoutheast-c.tableau.com/javascripts/api/tableau.embedding.3.latest.min.js"></script>
</head>
<body>
  <div class="container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="logo">
        <h2 style="margin-bottom: 0;">🌿 Pak Budi Resto</h2>
        <h3 style="margin-top: 5px; font-size: 14px;" ><small>part of sedunov resto holding</small></h3>
      </div>

      <div class="filter-group">
        <label for="year">Select Year</label>
        <select id="year">
          <option value="2022">2022</option>
          <option value="2023">2023</option>
          <option value="2024" selected>2024</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="month">Select Month</label>
        <select id="month">
          <option value="1">January</option>
          <option value="2">February</option>
          <option value="3">March</option>
          <option value="4">April</option>
          <option value="5">May</option>
          <option value="6">June</option>
          <option value="7">July</option>
          <option value="8">August</option>
          <option value="9" selected>September</option>
          <option value="10">October</option>
          <option value="11">November</option>
          <option value="12" >December</option>
        </select>
      </div>


      <div class="menu">
        <button id="DashboardSales">📈 Dashboard Sales</button>
        <button id="DashboardPurchase">📦 Dashboard Purchase</button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="content">
      <header>
        <h1 id="pageTitle">Restaurant Analytics - Sales Overview</h1>
      </header>

      <section class="viz-container">
        <tableau-viz id="tableauViz" token ="{{ token }}" hide-tabs toolbar='hidden'></tableau-viz>
      </section>
    </main>
  </div>
</body>
</html>
